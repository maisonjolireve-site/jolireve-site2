<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réservation confirmée — Jolirêve</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  body{ font-family:'Inter',sans-serif; background:#16303F; color:#fff; min-height:100vh; display:flex; align-items:center; justify-content:center; margin:0; padding: 2rem 1.2rem; text-align:center; }
  .card{ max-width: 480px; }
  h1{ font-family:'Fraunces',serif; font-weight:500; font-size: 2rem; margin-bottom: 1rem; }
  p{ color: rgba(255,255,255,.8); line-height:1.6; }
  a{ display:inline-block; margin-top: 1.5rem; background:#C1613F; color:#fff; padding:.8rem 1.6rem; border-radius:999px; text-decoration:none; font-weight:600; }
  .check{ font-size: 3rem; margin-bottom: .5rem; }
</style>
</head>
<body>
<div class="card">
  <div class="check">🌾</div>
  <h1>Votre acompte est confirmé</h1>
  <p>Merci ! Un e-mail de confirmation vient de vous être envoyé avec le récapitulatif de votre séjour à Jolirêve.
  L'adresse exacte et les modalités d'arrivée vous seront communiquées prochainement. Le solde sera à régler sur place.</p>
  <a href="/">Retour au site</a>
</div>
</body>
</html>
